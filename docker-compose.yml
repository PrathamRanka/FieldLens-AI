services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: fieldlens
      POSTGRES_PASSWORD: fieldlens
      POSTGRES_DB: fieldlens
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data", "./backend/sql/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldlens -d fieldlens"]
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://fieldlens:fieldlens@db:5432/fieldlens
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
  web:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_API_KEY: change-this-to-a-long-random-secret
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  pgdata:
