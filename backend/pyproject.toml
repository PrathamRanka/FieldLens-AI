[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "fieldlens-api"
version = "0.1.0"
description = "Enterprise RAG and agentic operations API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "python-multipart>=0.0.9",
  "psycopg[binary]>=3.2", "pgvector>=0.3", "pydantic-settings>=2.5",
  "google-genai>=1.0", "google-cloud-storage>=2.18", "google-cloud-aiplatform>=1.70",
  "langgraph>=0.2", "langchain-core>=0.3", "pypdf>=5.0", "python-docx>=1.1",
  "opentelemetry-api>=1.27", "opentelemetry-sdk>=1.27", "structlog>=24.4"
]
[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.7", "crewai>=0.80", "google-adk>=1.0"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
pythonpath = ["."]
